<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Moses</title>
<link rel="stylesheet" href="css/style.css">
<style>
.contact-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: calc(100vh - 64px);
}

/* LEFT */
.contact-left {
  background: var(--off-black);
  padding: 5rem 4rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-right: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

.contact-left::before {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.02) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.02) 40px);
  pointer-events: none;
}

.contact-big {
  font-family: var(--font-head);
  font-size: clamp(3rem, 5vw, 5rem);
  letter-spacing: 0.04em;
  line-height: 1;
  margin-bottom: 2.5rem;
  position: relative;
  z-index: 1;
}

.contact-methods {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  position: relative;
  z-index: 1;
}

.cm-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  text-decoration: none;
  padding: 1rem 1.25rem;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
  transition: background 0.2s, border-color 0.2s, transform 0.2s;
}

.cm-item:hover {
  background: rgba(255,255,255,0.07);
  border-color: rgba(255,255,255,0.25);
  transform: translateX(4px);
}

.cm-icon-wrap {
  width: 42px; height: 42px;
  background: rgba(255,255,255,0.06);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.15rem;
  flex-shrink: 0;
}

.cm-text {}
.cm-label {
  font-size: 0.7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 0.15rem;
}
.cm-val {
  font-size: 0.9rem;
  color: var(--white);
  font-weight: 400;
}

/* RIGHT - form */
.contact-right {
  padding: 5rem 4rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.form-title {
  font-family: var(--font-head);
  font-size: 1.5rem;
  letter-spacing: 0.06em;
  margin-bottom: 0.5rem;
}

.form-subtitle {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 2.5rem;
}

.contact-form {
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.field-group label {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 400;
}

.field-group input,
.field-group textarea {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.9rem 1.1rem;
  color: var(--white);
  font-family: var(--font-body);
  font-size: 0.92rem;
  font-weight: 300;
  outline: none;
  transition: border-color 0.2s;
  resize: none;
  width: 100%;
}

.field-group input::placeholder,
.field-group textarea::placeholder {
  color: rgba(255,255,255,0.2);
}

.field-group input:focus,
.field-group textarea:focus {
  border-color: rgba(255,255,255,0.4);
}

.send-btn {
  margin-top: 0.5rem;
  padding: 1rem 2.5rem;
  background: var(--white);
  color: var(--black);
  border: none;
  border-radius: 100px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  align-self: flex-start;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.send-btn:hover { opacity: 0.85; transform: translateY(-2px); }

.send-btn.success {
  background: #4ade80;
}

@media (max-width: 768px) {
  .contact-layout { grid-template-columns: 1fr; }
  .contact-left { min-height: 400px; padding: 3rem 1.5rem; border-right: none; border-bottom: 1px solid var(--border); }
  .contact-right { padding: 3rem 1.5rem; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">MOSES</a>
  <ul class="nav-links">
    <li><a href="index.html"><span class="nav-icon">🏠</span> <span>Home</span></a></li>
    <li><a href="about.html"><span class="nav-icon">ℹ️</span> <span>About</span></a></li>
    <li><a href="skills.html"><span class="nav-icon">💪</span> <span>Skills</span></a></li>
    <li><a href="services.html"><span class="nav-icon">🛠️</span> <span>Services</span></a></li>
    <li><a href="contact.html" class="nav-contact"><span>Contacts</span></a></li>
    <li><a href="donate.html"><span class="nav-icon">💝</span> <span>Donate</span></a></li>
  </ul>
</nav>

<div class="page">
  <div class="contact-layout">

    <!-- LEFT -->
    <div class="contact-left">
      <div class="contact-big fade-up">Contact<br>Me</div>

      <div class="contact-methods">
        <a href="https://instagram.com/ms_.moses" target="_blank" class="cm-item fade-up" data-delay="100">
          <div class="cm-icon-wrap">📸</div>
          <div class="cm-text">
            <div class="cm-label">Instagram</div>
            <div class="cm-val">ms_.moses</div>
          </div>
        </a>
        <a href="tel:0728619365" class="cm-item fade-up" data-delay="180">
          <div class="cm-icon-wrap">📞</div>
          <div class="cm-text">
            <div class="cm-label">Phone</div>
            <div class="cm-val">0728619365</div>
          </div>
        </a>
        <a href="mailto:mmoshami22@gmail.com" class="cm-item fade-up" data-delay="260">
          <div class="cm-icon-wrap">✉️</div>
          <div class="cm-text">
            <div class="cm-label">Email</div>
            <div class="cm-val">mmoshami22@gmail.com</div>
          </div>
        </a>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="contact-right">
      <div class="form-title fade-up">Send a Message</div>
      <div class="form-subtitle fade-up" data-delay="80">I'll get back to you as soon as possible.</div>

      <div class="contact-form">
        <div class="field-group fade-up" data-delay="130">
          <label>Email</label>
          <input type="email" id="fEmail" placeholder="Type Your Email">
        </div>
        <div class="field-group fade-up" data-delay="180">
          <label>Name</label>
          <input type="text" id="fName" placeholder="Type Your Name">
        </div>
        <div class="field-group fade-up" data-delay="230">
          <label>Message</label>
          <textarea id="fMsg" rows="5" placeholder="Your Message"></textarea>
        </div>
        <button class="send-btn fade-up" data-delay="290" id="sendBtn">
          Send Message ✉️
        </button>
      </div>
    </div>

  </div>
</div>

<script src="js/main.js"></script>
<script>
  document.getElementById('sendBtn').addEventListener('click', function() {
    const email = document.getElementById('fEmail').value.trim();
    const name  = document.getElementById('fName').value.trim();
    const msg   = document.getElementById('fMsg').value.trim();

    if (!email || !name || !msg) {
      this.textContent = '⚠️ Fill all fields';
      setTimeout(() => { this.innerHTML = 'Send Message ✉️'; }, 2000);
      return;
    }

    // Open mail client
    const subject = encodeURIComponent('Portfolio Inquiry from ' + name);
    const body    = encodeURIComponent('Name: ' + name + '\nEmail: ' + email + '\n\nMessage:\n' + msg);
    window.location.href = 'mailto:mmoshami22@gmail.com?subject=' + subject + '&body=' + body;

    this.textContent = '✓ Opening mail app...';
    this.classList.add('success');
    setTimeout(() => {
      this.innerHTML = 'Send Message ✉️';
      this.classList.remove('success');
      document.getElementById('fEmail').value = '';
      document.getElementById('fName').value  = '';
      document.getElementById('fMsg').value   = '';
    }, 3000);
  });
</script>
</body>
</html>
